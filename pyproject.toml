[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automail"
version = "0.1.0"
description = "Extensible approval email orchestration prototype for Outlook-based financial operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TRAE Assistant" }
]

[tool.setuptools]
packages = ["automail", "automail.adapters"]
